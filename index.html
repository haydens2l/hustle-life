<style>
:root{--bg:#0e1420;--bg2:#131b2b;--card:#182235;--card2:#1f2b42;--line:#2a3854;--text:#eef2ff;--dim:#93a0bd;
--mint:#34d399;--gold:#fbbf24;--coral:#fb7185;--violet:#a78bfa;--sky:#60a5fa;--orange:#fb923c;
--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:15px;line-height:1.38;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
input,textarea,select{font-size:16px;font-family:inherit}
textarea,input[type=text]{user-select:text;-webkit-user-select:text}
/* header */
#hdr{flex:none;padding:calc(var(--sat) + 10px) 12px 10px;background:linear-gradient(180deg,#18223a,#121a2c);display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.ava{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#2c3b5e,#3b2c5e);display:grid;place-items:center;font-size:30px;flex:none;border:2px solid rgba(255,255,255,.12);position:relative}
.ava .gen{position:absolute;bottom:-4px;right:-6px;font-size:10px;font-weight:900;background:var(--violet);color:#1b0b4a;border-radius:8px;padding:1px 5px}
.who{flex:1;min-width:0}
.who b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:12px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.money{text-align:right;flex:none}
.money b{display:block;font-size:17px;color:var(--mint);font-variant-numeric:tabular-nums}
.money b.neg{color:var(--coral)}
.money span{font-size:11px;color:var(--dim)}
.gear{width:44px;height:44px;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:19px;flex:none}
/* stats */
#stats{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:10px 14px;background:var(--bg2);border-bottom:1px solid var(--line)}
.st .n{font-size:10.5px;font-weight:700;color:var(--dim);white-space:nowrap}
.st{display:grid;grid-template-columns:18px 50px 1fr 24px;align-items:center;gap:6px;font-size:12px}
.st .l{font-size:14px}
.sb{height:9px;background:rgba(0,0,0,.4);border-radius:6px;overflow:hidden}
.sb i{display:block;height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.9,.3,1),background .5s}
.st b{font-variant-numeric:tabular-nums;text-align:right;color:var(--dim);font-size:11px}
/* log */
#log{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 12px 18px;overscroll-behavior:contain}
.yr{background:var(--card);border-radius:16px;padding:10px 12px;margin-bottom:10px;border:1px solid rgba(255,255,255,.04)}
.yr.new{animation:rise .35s cubic-bezier(.2,.9,.3,1.2)}
@keyframes rise{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}
.yh{display:flex;align-items:center;gap:8px;font-weight:900;font-size:13px;color:var(--gold);margin-bottom:4px}
.yh small{color:var(--dim);font-weight:700}
.le{display:flex;gap:8px;padding:5px 0;font-size:14px;border-top:1px solid rgba(255,255,255,.04)}
.le:first-of-type{border-top:0}
.le .e{flex:none;width:22px;text-align:center}
.le.fresh{animation:fadein .5s both}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}}
.chips{display:inline-flex;flex-wrap:wrap;gap:3px;margin-left:4px;vertical-align:middle}
.chip{font-size:10.5px;font-weight:800;padding:1px 6px;border-radius:10px;background:rgba(255,255,255,.08);white-space:nowrap}
.chip.p{background:rgba(52,211,153,.16);color:var(--mint)} .chip.n{background:rgba(251,113,133,.16);color:var(--coral)}
/* nav */

<script>
/* ============ HUSTLE LIFE · actions ============ */
function income(){return (L.job?L.job.sal:0)+L.biz.reduce((s,b)=>s+Math.max(0,b.profit*b.eq),0)+props().filter(p=>p.rented).reduce((s,p)=>s+p.val*.037,0);}
function canBorrow(x){const d=L.assets.reduce((s,a)=>s+(a.loan||0),0);return d+x<=Math.max(income()*6,L.cash*2);}
function startBiz(k,o={}){const T=BIZ[k],c=Math.round(o.half?T.cost/2:T.cost);if(L.cash<c)return null;ap({cash:-c});
 const b={id:nid(),k,name:o.name||genName(k),age:0,dem:0,rev:0,profit:0,val:T.cost,staff:0,mkt:1,time:fulltime()?.5:1,q:40,br:20,eq:o.cof?.5:1,run:0,raised:0,cof:o.cof||null,hist:[],hype:0};
 if(o.cof){const p=L.people.find(x=>x.id===o.cof);if(p){p.cof=b.id;p.bond=clamp(p.bond+10,0,100);}}
 L.biz.push(b);L.stats.bizStarted++;return b;}
function raiseOffer(b){if(b.offerAge===L.age)return b.offer;let o=null;
 if(b.val>20000){const amt=Math.round(Math.max(50000,b.val*rnd(.2,.35))/1000)*1000;o={amt,eq:amt/(b.val+amt)};}
 else if(['app','saas'].includes(b.k)&&b.q>=35){const amt=ri(10,30)*10000;o={amt,eq:rnd(.12,.25)};}
 b.offer=o;b.offerAge=L.age;return o;}
function sellOffer(b){if(b.sellAge===L.age)return b.sellP;b.sellP=Math.round(b.val*b.eq*rnd(.85,1.15));b.sellAge=L.age;return b.sellP;}
function genListings(){if(L.listings&&L.listings.age===L.age)return L.listings.items;const m=cm(),items=[];
 const pool=[0,0,1,1,2,2,3,4,5];for(let i=0;i<5;i++){const P=PROPS[pick(pool)];items.push({k:P.k,n:P.n,e:P.e,v:Math.round(P.v*m*rnd(.85,1.2)/5000)*5000,sub:pick(SUBURBS[city().n]||SUBURB_PRE)});}
 items.sort((a,b)=>a.v-b.v);L.listings={age:L.age,items};return items;}
function propCost(l,dep,first){const stamp=first&&l.v<800000?0:Math.round(l.v*.04);return Math.round(l.v*dep)+stamp;}
function buyProp(l,dep=.2,first=false){const need=propCost(l,dep,first);if(L.cash<need)return null;const loan=Math.round(l.v*(1-dep));
 if(loan>0&&!canBorrow(loan))return 'The bank declined your home loan. You need more income.';
 ap({cash:-need});const a={id:nid(),kind:'prop',name:l.n+(l.sub?' in '+l.sub:''),k:l.k,e:l.e,val:l.v,buy:l.v,loan,term:30,rented:false,live:false};
 L.assets.push(a);if(L.home!=='own'){a.live=true;L.home='own';L.rent=0;}else a.rented=true;ap({hap:6});
 return `You bought a ${l.n.toLowerCase()} for ${fmt(l.v)}${loan?` with a ${fmt(loan)} mortgage`:''}. ${a.live?'You moved in!':'It\'s now rented out.'}`;}
function sellProp(a){const net=Math.round(a.val*.98-a.loan);ap({cash:net});L.assets=L.assets.filter(x=>x!==a);
 if(a.live&&!props().some(p=>p.live)){L.home='rent';L.rent=Math.round(26000*cm());}
 return `Sold for ${fmt(a.val)}. After the mortgage and agent fees you pocketed ${fmt(net)}.`;}
function buyCar(c){if(L.cash<c.v)return null;ap({cash:-c.v,hap:c.hap,cha:c.cha});L.assets.push({id:nid(),kind:'car',name:c.n,e:c.e,val:c.v,ute:c.ute||0});return `You bought a ${c.n.toLowerCase()}!`;}
function invest(sub,amt){amt=Math.min(amt,Math.max(0,L.cash));if(amt<1)return null;ap({cash:-amt});let a=L.assets.find(x=>x.kind==='inv'&&x.sub===sub);
 if(!a){a={id:nid(),kind:'inv',sub,name:INVEST[sub].n,e:INVEST[sub].e,val:0,cost:0};L.assets.push(a);}a.val+=amt;a.cost=(a.cost||0)+amt;return `You invested ${fmt(amt)} in ${INVEST[sub].n}.`;}
function sellInv(a,frac){const v=Math.round(a.val*frac);ap({cash:v});a.val-=v;a.cost=(a.cost||0)*(1-frac);if(a.val<10)L.assets=L.assets.filter(x=>x!==a);return `You sold ${fmt(v)} of ${a.name}.`;}
function takeLoan(n){if(!canBorrow(n))return 'The bank said no. Not enough income.';ap({cash:n});L.assets.push({id:nid(),kind:'loan',name:'Personal loan',e:'🏦',loan:n,orig:n});return `You borrowed ${fmt(n)} at 10% interest.`;}
/* jobs */
function jobReqs(J){const r=[];if(L.age<J.min)r.push('Age '+J.min+'+');if(J.q&&!J.q.some(hasQ))r.push(J.q.map(q=>QN[q]).join(' or '));
 if(J.s)for(const k in J.s)if(L.st[k]<J.s[k])r.push(STATS.find(s=>s[0]===k)[2]+' '+J.s[k]+'+');
 if(!J.pt&&(inSchool()||L.uni))r.push('Finish study first');if(!J.pt&&L.tafe&&TAFE[L.tafe.k].app)r.push('Finish apprenticeship');if(L.retired)r.push('Retired');return r;}
function applyJob(id){const J=JOBMAP[id];if(jobReqs(J).length)return null;if(L.done['apply'+id])return 'They already turned you down this year.';L.done['apply'+id]=1;
 const p=(J.pt?.82:.55)+(L.st.cha-50)/250+(L.st.sma-50)/400+L.st.rep/400;
 if(!chance(clamp(p,.15,.95))){ap({hap:-2});return `You interviewed for ${J.lv[0]} but they went with someone else.`;}
 L.job={id,lvl:0,perf:50,yrs:0,sal:Math.round(J.sal*rnd(.95,1.08)/100)*100};ap({hap:5});return `You got the job! You're now a ${J.lv[0]} on ${fmt(L.job.sal)}.`;}
/* study */
function uniOk(k){const U=UNI[k];if(L.uni||L.tafe)return 'Already studying';if(L.age<17)return 'Too young';if(inSchool())return 'Finish school first';
 if(hasQ(k))return 'Already have it';if(hasQ('y12')&&(L.atar||0)>=U.atar)return '';if(L.age>=21&&U.atar<=82)return '';return hasQ('y12')?'ATAR '+U.atar+' needed':'Year 12 needed (or mature age 21+)';}
function tafeOk(k){const T=TAFE[k];if(L.uni||L.tafe)return 'Already studying';if(L.age<16)return 'Age 16+';if(inSchool())return 'Leave school first';if(hasQ(k))return 'Already qualified';if(T.fee&&L.cash<T.fee)return 'Need '+fmt(T.fee);return '';}
/* activities */
function treat(){if(!L.ill.length){ap({hea:3});return 'The GP says you\'re in good shape.';}const out=[];
 for(const i of [...L.ill]){const I=ILL[i.k];if(L.cash<I.cost){out.push(`Couldn't afford treatment for ${I.n} (${fmt(I.cost)}).`);continue;}ap({cash:-I.cost});
  if(chance(I.cure)){L.ill=L.ill.filter(x=>x!==i);ap({hea:8});out.push(`Treatment for ${I.n} worked!`);}else{ap({hea:2});out.push(`Treatment for ${I.n} didn't fully work.`);}}return out.join(' ');}
function gamble(game,bet){if(L.cash<bet)return null;ap({cash:-bet});let win=0;
 if(game==='pokies'){const r=Math.random();win=r<.015?bet*20:r<.38?bet*1.5:0;}
 else if(game==='blackjack')win=chance(.46)?bet*2:0;
 else if(game==='roulette')win=chance(.486)?bet*2:0;
 else if(game==='number')win=chance(1/37)?bet*36:0;
 ap({cash:win});L.stats.gamble+=win-bet;ap({str:2});
 return win>0?`You won ${fmt(win)}!`:`You lost ${fmt(bet)}.`;}
</script>

<script>
/* ============ HUSTLE LIFE · UI ============ */
let STACK=[],AC=null,lastAge=-1,startTmp=null,modalQ=[],mOpen=false;
const SL={hap:'😊',hea:'❤️',sma:'🧠',cha:'✨',str:'😰',rep:'⭐'};
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;const b=$('#toasts');b.appendChild(t);while(b.children.length>2)b.firstChild.remove();setTimeout(()=>{t.classList.add('out');setTimeout(()=>t.remove(),300);},2400);}
function haptic(k){if(!G.meta.settings.haptics||!navigator.vibrate)return;if(navigator.userActivation&&!navigator.userActivation.hasBeenActive)return;try{navigator.vibrate(k==='win'?[20,40,30]:k==='bad'?[50,30,50]:12);}catch(e){}}
const TONES={age:[523,784],win:[523,659,784,1047],bad:[330,247],tap:[660],death:[392,330,262]};
function sfx(k){if(!G||!G.meta.settings.sound||!AC)return;try{const n=AC.currentTime;(TONES[k]||[600]).forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0,n+i*.09);g.gain.linearRampToValueAtTime(.07,n+i*.09+.01);g.gain.exponentialRampToValueAtTime(.001,n+i*.09+.22);o.connect(g).connect(AC.destination);o.start(n+i*.09);o.stop(n+i*.09+.25);});}catch(e){}}
function unlockAudio(){try{if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(C)AC=new C();}if(AC&&AC.state==='suspended')AC.resume();}catch(e){}}
function confetti(n=30){for(let i=0;i<n;i++){const c=document.createElement('div');c.className='confetti';c.textContent=pick(['🎉','💸','⭐','💰','✨','🥳']);c.style.left=rnd(0,96)+'vw';c.style.animationDuration=rnd(1.6,3)+'s';c.style.animationDelay=rnd(0,.4)+'s';document.body.appendChild(c);setTimeout(()=>c.remove(),3600);}}
function confettiSoon(){setTimeout(()=>confetti(),300);}
function chipsHTML(fx){if(!fx)return '';const out=[];for(const k in fx){const v=Math.round(fx[k]);if(!v)continue;
 if(k==='cash')out.push(`<span class="chip ${v>0?'p':'n'}">${v>0?'+':''}${fmt(v)}</span>`);else{const good=k==='str'?v<0:v>0;out.push(`<span class="chip ${good?'p':'n'}">${v>0?'+':''}${v} ${SL[k]}</span>`);}}
 return out.length?`<span class="chips">${out.join('')}</span>`:'';}
function avatar(p,age,g){if(p&&p.alive===false)return '🪦';age=age??(p?p.age:0);g=g??(p?p.g:'m');return age<3?'👶':age<13?(g==='m'?'👦':'👧'):age<20?(g==='m'?'🧑':'👩‍🦱'):age<60?(g==='m'?'👨':'👩'):(g==='m'?'👴':'👵');}
function statColor(k,v){const good=k==='str'?100-v:v;return good>=66?'linear-gradient(90deg,#22b07c,#5ee8b5)':good>=33?'linear-gradient(90deg,#f59e0b,#fcd34d)':'linear-gradient(90deg,#e11d48,#fb7185)';}
function status(){if(!L.alive)return `Died at ${L.age} · ${L.cause}`;if(L.retired)return 'Retired';if(L.job)return jobTitle(L.job)+(L.biz.length?' + founder':'');
 if(L.uni)return 'Uni student · '+UNI[L.uni.k].n;if(L.tafe)return (TAFE[L.tafe.k].app?'Apprentice · ':'TAFE · ')+TAFE[L.tafe.k].n;
 if(L.biz.length)return 'Founder · '+L.biz[0].name;if(L.school==='primary')return 'Primary school student';if(L.school==='high')return 'High school student';if(L.age<5)return 'Living the toddler life';return 'Unemployed';}
function renderTop(){$('#ava').innerHTML=(L.alive?avatar(null,L.age,L.g):'🪦')+(G.meta.gen>1?`<span class="gen">G${G.meta.gen}</span>`:'');
 $('#hName').textContent=fullName();$('#hSub').textContent=`Age ${L.age} · ${city().n}, ${city().s}`;$('#hJob').textContent=status();
 const c=$('#hCash');c.textContent=fmt(L.cash);c.classList.toggle('neg',L.cash<0);$('#hNw').textContent='Net worth '+fmt(nw());
 $('#stats').innerHTML=STATS.map(([k,e,n])=>`<div class="st"><span class="l">${e}</span><span class="n">${k==='rep'?'Rep':n}</span><div class="sb"><i style="width:${L.st[k]}%;background:${statColor(k,L.st[k])}"></i></div><b>${L.st[k]}</b></div>`).join('');
 $('#ageBtn').classList.toggle('dis',!L.alive);$('#dotBiz').classList.toggle('on',L.biz.some(b=>b.capped));}
function renderLog(){const el=$('#log'),isNew=L.age!==lastAge;lastAge=L.age;
 el.innerHTML=L.log.slice(-70).map(y=>`<div class="yr${isNew&&y.age===L.age?' new':''}"><div class="yh">${y.age===0?'Born':'Age '+y.age} <small>· ${y.year}</small></div>${y.items.map(it=>`<div class="le"><span class="e">${it.e}</span><span>${esc(it.t)}${chipsHTML(it.fx)}</span></div>`).join('')||'<div class="le dim"><span class="e">·</span><span>A quiet year.</span></div>'}</div>`).join('');
 requestAnimationFrame(()=>{el.scrollTop=el.scrollHeight;});}
function render(){renderTop();renderLog();if(STACK.length)renderSheet(false);}

/* ---------- html helpers ---------- */
const row=(ic,t,s,rt,attrs,cls='')=>`<button class="row ${cls}" ${attrs||''}><span class="ic">${ic}</span><span class="tx"><b>${t}</b>${s?`<span>${s}</span>`:''}</span>${rt!=null?`<span class="rt">${rt}</span>`:''}</button>`;
const go=(v,id)=>`data-act="go" data-v="${v}"${id!=null?` data-id="${id}"`:''}`;
const da=(v,id)=>`data-act="do" data-v="${v}"${id!=null?` data-id="${id}"`:''}`;
const sec=t=>`<div class="sec">${t}</div>`;
const bar=(v,c)=>`<div class="bar"><i style="width:${clamp(v,0,100)}%;${c?'background:'+c:''}"></i></div>`;
const done=k=>L.done[k]?' <span class="pill">done</span>':'';
function spark(vals){if(vals.length<2)return '';const W=320,H=60,mx=Math.max(...vals,1),mn=Math.min(...vals,0);const pts=vals.map((v,i)=>`${(i/(vals.length-1)*W).toFixed(1)},${(H-4-(v-mn)/(mx-mn||1)*(H-8)).toFixed(1)}`).join(' ');
 return `<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><polyline fill="none" stroke="#34d399" stroke-width="2.5" stroke-linejoin="round" points="${pts}"/></svg>`;}

/* ---------- sheets ---------- */
function openSheet(t,id){STACK=[{t,id}];$('#sheetWrap').classList.add('on');renderSheet(true);sfx('tap');}
function pushSheet(t,id){STACK.push({t,id});renderSheet(true);}
function popSheet(){STACK.pop();if(!STACK.length)return closeSheet();renderSheet(true);}
function closeSheet(){STACK=[];$('#sheetWrap').classList.remove('on');}
function renderSheet(anim){const top=STACK[STACK.length-1];if(!top)return;const S=SHEETS[top.t];if(!S){closeSheet();return;}let r;try{r=S(top.id);}catch(e){console.error(e);popSheet();return;}
 const old=$('#sheet .sbody'),st=!anim&&old?old.scrollTop:0;
 $('#sheet').innerHTML=`<div class="sh">${STACK.length>1?'<button class="ib" data-act="back" aria-label="Back">‹</button>':''}<h2>${r[0]}</h2><button class="ib" data-act="close" aria-label="Close">✕</button></div><div class="sbody${anim?' slide':''}">${r[1]}</div>`;
 if(!anim)$('#sheet .sbody').scrollTop=st;}
const SHEETS={
 career(){let h='';const J=L.job&&JOBMAP[L.job.id];
  if(L.job){const j=L.job;h+=`<div class="card"><div style="display:flex;gap:10px;align-items:center"><span style="font-size:34px">${J.e}</span><div style="flex:1"><b style="font-size:17px">${jobTitle(j)}</b><div class="hint">${J.n}${J.fifo?' · FIFO':''}${J.pt?' · part-time':''} · ${j.yrs} yr${j.yrs===1?'':'s'}</div></div></div>
   <div class="kv" style="margin-top:10px"><div><span>Salary</span><b>${fmt(j.sal)}</b></div><div><span>Level</span><b>${j.lvl+1}/${J.lv.length}</b></div><div><span>Stress</span><b>+${J.x}/yr</b></div></div>
   <div class="hint" style="margin-top:8px">Performance</div>${bar(j.perf)}</div>`;
   h+=row('💪','Work harder','Performance up, stress up'+done('jobHard'),null,da('jobHard'))+row('🛋️','Slack off','Less stress, worse performance'+done('jobSlack'),null,da('jobSlack'))+
    row('📈','Ask for a promotion',j.lvl<J.lv.length-1?'Next: '+J.lv[j.lvl+1]+done('jobPromo'):'You\'re at the top',null,da('jobPromo'),j.lvl<J.lv.length-1?'':'lock')+
    row('💰','Ask for a raise',done('jobRaise').trim()||'Results may vary',null,da('jobRaise'))+row('🍻','Socialise with coworkers','Reputation, maybe a new mate'+done('jobSocial'),null,da('jobSocial'))+row('🚪','Quit','Walk out',null,da('jobQuit'));}
  h+=sec('Education');

  h+=sec('Ribbons')+`<div class="g3">${RIBBONS.map(r=>{const g=G.meta.ribbons[r.id];return `<div class="ribbon ${g?'':'lock'}"><span class="re">${r.e}</span>${r.n}<small>${g?esc(g.name)+' · '+g.age:r.d}</small></div>`;}).join('')}</div>`;
  if(G.meta.lineage.length)h+=sec('Family tree & past lives')+G.meta.lineage.slice(0,25).map(x=>row(x.rb[0],esc(x.name)+` <span class="dim" style="font-weight:600">G${x.gen}</span>`,`${x.born}–${x.died} · died at ${x.age} · ${esc(x.cause)}`,`${fmt(x.nw)}<br><small class="dim">${x.rb[1]}</small>`)).join('');
  return ['Ribbons',h];},
 settings(){const s=G.meta.settings;let h=sec('Preferences')+`<div class="g2"><button class="btn" data-act="toggle" data-v="sound">${s.sound?'🔊 Sound on':'🔇 Sound off'}</button><button class="btn" data-act="toggle" data-v="haptics">${s.haptics?'📳 Haptics on':'📴 Haptics off'}</button></div><div class="hint">Haptics work on Android. iPhones don't allow vibration from web apps.</div>`;
  h+=sec('Backup')+`<button class="btn block" data-act="export">📤 Export save code</button><textarea id="saveCode" placeholder="Your save code appears here. Paste a code to import." style="margin-top:8px"></textarea><div class="g2" style="margin-top:8px"><button class="btn" data-act="copy">📋 Copy</button><button class="btn gold" data-act="import">📥 Import</button></div>`;
  h+=sec('How to play')+`<div class="card hint" style="font-size:13px;line-height:1.5">Tap <b>+ AGE</b> to live another year. Events pop up with choices, and everything gets written to your life log.<br><br>💼 Career: school, uni, TAFE, trades, FIFO and jobs<br>🚀 Business: start ventures, set marketing, hire, raise and sell<br>🏠 Assets: property, cars, shares, crypto, loans<br>❤️ People: family, partners, friends, kids<br>🎯 Activities: health, learning, holidays, casino<br><br>When you die, continue as one of your kids (they inherit your estate) or start fresh. Ribbons carry across lives.</div>`;
  h+=sec('Danger zone')+row('🔄','Start a new life','Abandon this life',null,'data-act="abandon"')+row('🗑️','Reset everything','Delete all lives, ribbons and saves',null,'data-act="reset"');
  h+=`<div class="hint" style="text-align:center;margin-top:10px">Hustle Life · save v${SAVE_VERSION}</div>`;return ['Settings',h];},
};
</script>

<script>
/* ============ HUSTLE LIFE · controller ============ */
const bz=id=>L.biz.find(b=>b.id==id);

const ast=id=>L.assets.find(a=>a.id==id);
const ACT={
 study:{e:'📚',once:1,f:()=>{if(inSchool()){ap({sma:ri(3,5),str:3});L.study++;return 'You hit the books hard this year.';}if(L.uni){ap({sma:3,str:4});L.study++;return 'Library grind. Your grades are solid.';}return null;}},
 wag:{e:'🛹',once:1,f:()=>{ap({hap:5,sma:-2});if(chance(.25)){ap({rep:-2});return 'You got caught wagging. Detention.';}return 'You spent the day at the skate park.';}},
 uniParty:{e:'🍺',once:1,f:()=>{ap({hap:6,sma:-1,hea:-1});if(chance(.5)){const f=newFriend();return `Great night. You met ${f.first}.`;}return 'You don\'t remember much.';}},
 dropSchool:{e:'🎒',confirm:()=>'Leave school after Year 10? You won\'t get an ATAR.',f:()=>{L.school='left';L.stats.droppedOut=true;ap({hap:4,sma:-2});return 'You left school. Time to work or learn a trade.';}},
 dropUni:{e:'🚪',confirm:()=>'Drop out of uni? Your HECS debt stays.',f:()=>{const n=UNI[L.uni.k].n;L.uni=null;L.stats.droppedOut=true;ap({hap:3,str:-6});return `You dropped out of your ${n}.`;}},
 dropTafe:{e:'🚪',confirm:()=>'Quit your course?',f:()=>{const n=TAFE[L.tafe.k].n;L.tafe=null;ap({str:-4});return `You quit your ${n}.`;}},
 uni:{e:'🎓',confirm:k=>`Enrol in a ${UNI[k].n}? ${UNI[k].y} years at ${fmt(UNI[k].fee)}/yr on HECS.${fulltime()?' You\'ll quit your full-time job.':''}`,f:k=>{if(uniOk(k))return null;if(fulltime())L.job=null;L.uni={k,y:0};ap({hap:5});return `You enrolled in a ${UNI[k].n}!`;}},
 tafe:{e:'🧰',confirm:k=>`Start ${TAFE[k].n}?${TAFE[k].app&&L.job?' You\'ll leave your current job.':''}`,f:k=>{if(tafeOk(k))return null;const T=TAFE[k];if(T.app)L.job=null;L.tafe={k,y:0};ap({hap:4});return T.app?`You started a ${T.n}. Earn while you learn!`:`You enrolled in a ${T.n}.`;}},
 apply:{e:'📝',confirm:id=>fulltime()&&!JOBMAP[id].pt?`Apply as ${JOBMAP[id].lv[0]}? If you get it, you'll leave your current job.`:null,f:id=>applyJob(id)},
 jobHard:{e:'💪',once:1,f:()=>{L.job.perf=clamp(L.job.perf+18,0,100);L.job.hard=4;ap({str:5});return 'You put in the extra hours. The boss noticed.';}},
 jobSlack:{e:'🛋️',once:1,f:()=>{L.job.perf=clamp(L.job.perf-12,0,100);ap({str:-6,hap:3});return 'Long lunches and "working from home".';}},
 jobPromo:{e:'📈',once:1,f:()=>{const j=L.job,J=JOBMAP[j.id];if(j.lvl>=J.lv.length-1)return 'There\'s nowhere higher to go.';if(j.perf>62&&chance(.35+j.perf/250)){j.lvl++;j.sal=Math.round(j.sal*J.step/100)*100;j.perf=55;ap({hap:8,rep:2});return `Promoted to ${jobTitle(j)}! Salary now ${fmt(j.sal)}.`;}j.perf-=4;ap({hap:-3});return '"Not yet. Keep doing what you\'re doing."';}},
 jobRaise:{e:'💰',once:1,f:()=>{const j=L.job;if(chance(.3+j.perf/300+L.st.cha/400)){j.sal=Math.min(salCap(j),Math.round(j.sal*rnd(1.04,1.1)/100)*100);ap({hap:5});return `Raise approved! You're now on ${fmt(j.sal)}.`;}j.perf-=5;ap({hap:-3});return 'Request denied. Awkward.';}},
 jobSocial:{e:'🍻',once:1,f:()=>{ap({rep:2,hap:3});if(chance(.4)){const f=newFriend();return `Friday drinks with the team. You clicked with ${f.first}.`;}return 'Friday drinks with the team.';}},
 jobQuit:{e:'🚪',confirm:()=>`Quit your job as ${jobTitle(L.job)}?`,f:()=>{const t=jobTitle(L.job);L.job=null;ap({str:-8,hap:2});return `You quit your job as ${t}.`;}},
 retire:{e:'🏖️',confirm:()=>'Retire? You\'ll stop working for good.',f:()=>{L.retired=true;L.job=null;ap({hap:10,str:-20});return 'You retired! Lawn bowls and grey nomad trips await.';}},
 super:{e:'🧓',confirm:()=>`Withdraw ${fmt(L.sup)} from super?`,f:()=>{const s=L.sup;L.sup=0;ap({cash:s});return `You withdrew ${fmt(s)} from your super.`;}},
 sprint:{e:'⚡',once:1,f:id=>{const b=bz(id);b.q=clamp(b.q+12,0,100);ap({str:7});return `You pulled all-nighters improving ${b.name}.`;}},
 promo:{e:'📣',once:1,f:id=>{if(L.cash<5000)return null;const b=bz(id);ap({cash:-5000});b.br=clamp(b.br+12,0,100);b.dem*=1.05;return `You ran a promo campaign for ${b.name}.`;}},
 closeBiz:{e:'🪦',confirm:id=>`Shut down ${bz(id).name}? This can't be undone.`,f:id=>{const b=bz(id);closeBiz(b,'closed');ap({hap:-4});return `You shut down ${b.name}.`;}},
 buyProp:{e:'🔑',confirm:i=>{const l=genListings()[i],f=!props().length&&L.age<45;return `Buy this ${l.n.toLowerCase()} in ${l.sub} for ${fmt(l.v)}? You need ${fmt(propCost(l,f?.05:.2,f))} upfront.`;},f:i=>{const l=genListings()[i],f=!props().length&&L.age<45;const r=buyProp(l,f?.05:.2,f);if(r&&!r.startsWith('The bank'))L.listings.items.splice(i,1);return r;}},
 propLive:{e:'🛏️',f:id=>{props().forEach(p=>{if(p.live){p.live=false;p.rented=true;}});const a=ast(id);a.live=true;a.rented=false;L.home='own';L.rent=0;return `You moved into your ${a.name.toLowerCase()}.`;}},
 propRent:{e:'🔑',f:id=>{const a=ast(id);if(a.live){a.live=false;if(!props().some(p=>p.live&&p!==a)){L.home='rent';L.rent=Math.round(26000*cm());}}a.rented=true;return `Your ${a.name.toLowerCase()} is now rented out.`;}},
 reno:{e:'🛠️',once:1,f:id=>{const a=ast(id),c=Math.round(a.val*.06);if(L.cash<c)return null;ap({cash:-c,str:5});a.val=Math.round(a.val*rnd(1.07,1.15));return `Renovation done. Now valued at ${fmt(a.val)}.`;}},
 sellProp:{e:'🪧',confirm:id=>`Sell your ${ast(id).name.toLowerCase()}?`,f:id=>sellProp(ast(id))},
 buyCar:{e:'🚗',confirm:i=>`Buy a ${CARS[i].n.toLowerCase()} for ${fmt(CARS[i].v)}?`,f:i=>buyCar(CARS[i])},
 sellCar:{e:'🚗',confirm:id=>`Sell your ${ast(id).name.toLowerCase()} for ${fmt(ast(id).val)}?`,f:id=>{const a=ast(id);ap({cash:a.val});L.assets=L.assets.filter(x=>x!==a);return `You sold your ${a.name.toLowerCase()}.`;}},
 invest:{e:'📈',f:v=>{const [k,a]=String(v).split(':');const amt=a==='half'?Math.floor(L.cash/2):+a;return invest(k,amt);}},
 sellInv:{e:'💵',f:v=>{const [id,fr]=String(v).split(':');return sellInv(ast(id),+fr);}},
 loan:{e:'🏦',confirm:n=>`Borrow ${fmt(+n)} at 10%?`,f:n=>takeLoan(+n)},
 repay:{e:'✅',f:id=>{const a=ast(id);if(L.cash<a.loan)return null;ap({cash:-a.loan});L.assets=L.assets.filter(x=>x!==a);return `You paid off ${a.name.toLowerCase()}.`;}},
 live:{e:'🏠',f:k=>{const m=cm();if(k==='parents'){L.home='parents';L.rent=0;ap({hap:-3});return 'You moved back in with your folks.';}if(L.home==='own')props().forEach(p=>{if(p.live){p.live=false;p.rented=true;}});
  L.home=k==='share'?'share':'rent';L.rent=Math.round((k==='share'?14000:k==='rent'?26000:42000)*m);ap({hap:k==='house'?5:3,cash:-1500});return `You moved into a ${k==='share'?'share house':k==='rent'?'rental unit':'rental house'}.`;}},
 city:{e:'🧳',confirm:i=>`Move to ${CITIES[i].n}?${L.job&&!JOBMAP[L.job.id].fifo?' You\'ll need a new job.':''}`,f:i=>{if(L.cash<3000)return null;ap({cash:-3000,str:6,hap:3});const old=city().n;L.city=+i;if(L.job&&!JOBMAP[L.job.id].fifo)L.job=null;L.listings=null;if(L.home==='own'){props().forEach(p=>{if(p.live){p.live=false;p.rented=true;}});L.home='rent';L.rent=Math.round(26000*cm());}return `You moved from ${old} to ${city().n}!`;}},
 pTime:{e:'⏱️',once:1,f:id=>{const p=per(id);p.bond=clamp(p.bond+ri(8,15),0,100);ap({hap:3});return `You spent quality time with ${p.first}.`;}},
 pChat:{e:'💬',once:1,f:id=>{const p=per(id);p.bond=clamp(p.bond+4,0,100);return `You had a good yarn with ${p.first}.`;}},
 pGift:{e:'🎁',once:1,f:id=>{if(L.cash<200)return null;const p=per(id);ap({cash:-200});p.bond=clamp(p.bond+10,0,100);return `${p.first} loved the gift.`;}},
 pArgue:{e:'😤',once:1,f:id=>{const p=per(id);p.bond=clamp(p.bond-15,0,100);ap({hap:-2,str:3});return `You and ${p.first} had a blazing row about ${pick(['politics','money','the dishes','who\'s the best footy team','crypto'])}.`;}},
 pAsk:{e:'🙏',once:1,f:id=>{const p=per(id);const pool=p.rel==='sib'?2000:(p.money||5000);if(chance(p.bond/130)){const n=Math.max(20,Math.round(Math.min(pool*rnd(.02,.08),L.age<18?200:50000)/10)*10);ap({cash:n});p.bond-=5;if(p.money)p.money-=n;return `${p.first} gave you ${fmt(n)}.`;}p.bond-=8;return `${p.first} said no.`;}},
 pDate:{e:'🍷',once:1,f:id=>{if(L.cash<250)return null;const p=per(id);ap({cash:-250,hap:5});p.bond=clamp(p.bond+12,0,100);return `Date night with ${p.first} at ${pick(['a rooftop bar','the local Thai place','a fancy degustation','the drive-in'])}.`;}},
 pBaby:{e:'🍼',once:1,f:id=>{if(chance(.55)){const k=addChild();ap({hap:12,str:6});return `It worked! Welcome to the world, ${k.first}.`;}return 'No luck this year.';}},
 pBreak:{e:'💔',confirm:id=>`${per(id).rel==='spouse'?'Divorce':'Break up with'} ${per(id).first}?`,f:id=>breakUp(per(id))},
 pMoney:{e:'💸',once:1,f:id=>{if(L.cash<10000)return null;const p=per(id);ap({cash:-10000});p.bond=clamp(p.bond+15,0,100);p.money=(p.money||0)+10000;return `You gave ${p.first} $10,000.`;}},
 pUnfriend:{e:'👋',confirm:id=>`Stop being friends with ${per(id).first}?`,f:id=>{const p=per(id);p.alive=false;p.gone=1;L.people=L.people.filter(x=>x!==p);return `You and ${p.first} drifted apart.`;}},
 pReconnect:{e:'📞',once:1,f:id=>{const p=per(id);if(!partner()&&chance(.3)){p.rel='partner';p.bond=50;ap({hap:6});return `You and ${p.first} are giving it another go.`;}ap({hap:-3});return `${p.first} left you on read.`;}},
 makeFriend:{e:'🤙',once:1,f:()=>{if(chance(.45+L.st.cha/250)){const f=newFriend();ap({hap:4});return `You met ${f.first} ${pick(['at the gym','at a barbecue','through work','at trivia night','at the dog park'])}. New mate!`;}return 'You tried, but nobody clicked.';}},
 gym:{e:'🏋️',once:1,f:()=>{if(L.cash<900)return null;ap({cash:-900,hea:6,cha:2,str:-6});return 'You hit the gym all year. Gains.';}},
 run:{e:'🏃',once:1,f:()=>{ap({hea:3,str:-3});return 'You did parkrun every Saturday.';}},
 doctor:{e:'🩺',once:1,f:()=>treat()},
 surgery:{e:'💉',once:1,confirm:()=>'Cosmetic surgery for $15,000? Small risk of a botch job.',f:()=>{if(L.cash<15000)return null;ap({cash:-15000});if(chance(.15)){ap({cha:-8,hap:-8});return 'It was botched. You look... different.';}ap({cha:9,hap:5});return 'You look incredible.';}},
 meditate:{e:'🧘',once:1,f:()=>{ap({str:-8,hap:2});return 'Ten minutes a day on the meditation app.';}},
 yoga:{e:'🌿',once:1,f:()=>{if(L.cash<1500)return null;ap({cash:-1500,str:-18,hap:4,hea:2});return 'A week-long retreat in the hinterland. Namaste.';}},
 psych:{e:'🛋️',once:1,f:()=>{if(L.cash<1500)return null;ap({cash:-1500,str:-14,hap:8});let t='Therapy helped you unpack a lot.';if(L.ill.some(i=>i.k==='dep')&&chance(.6)){L.ill=L.ill.filter(i=>i.k!=='dep');t+=' Your depression has lifted.';}return t;}},
 read:{e:'📖',once:1,f:()=>{ap({sma:2});return `You read ${pick(['"The Barefoot Investor"','a biography of a tech founder','"Atomic Habits"','a stack of sci-fi','"The Lean Startup"'])}.`;}},
 course:{e:'💻',once:1,f:()=>{if(L.cash<500)return null;ap({cash:-500,sma:4});return 'You finished an online course and actually watched every video.';}},
 speak:{e:'🎤',once:1,f:()=>{if(L.cash<2000)return null;ap({cash:-2000,cha:5,rep:2});return 'You can now hold a room without your voice shaking.';}},
 boot:{e:'👩‍💻',confirm:()=>'Do a 16-week coding bootcamp for $14,000?',f:()=>{if(L.cash<14000)return null;ap({cash:-14000,sma:6,str:8});L.quals.push('boot');return 'You graduated from coding bootcamp! Software jobs are now open to you.';}},
 goout:{e:'🍸',once:1,f:()=>{if(L.cash<150)return null;ap({cash:-150,hap:5,hea:-2});if(!partner()&&chance(.3+L.st.cha/300)){const p=newPartner();L.people.push(p);return `You met ${p.first} on the dance floor. You're now seeing each other!`;}if(chance(.35)){const f=newFriend();return `Big night. You made a new mate, ${f.first}.`;}return 'Big night out. Kebab on the way home.';}},
 network:{e:'🤝',once:1,f:()=>{if(L.cash<100)return null;ap({cash:-100,rep:3,cha:1});if(chance(.5)){const f=newFriend({bond:45});return `You met ${f.first}, a fellow founder type.`;}return 'Lots of business cards, one decent conversation.';}},
 volunteer:{e:'🫶',once:1,f:()=>{ap({rep:3,hap:4});return `You volunteered at ${pick(['the local food bank','a koala hospital','a beach clean-up','the SES'])}.`;}},
 post:{e:'📱',once:1,f:()=>{if(chance(.12+L.st.cha/500)){ap({rep:10,hap:6});return 'Your post went viral! Followers flooding in.';}ap({rep:1});return 'Your post got 14 likes. Your mum liked it twice.';}},
 hol:{e:'✈️',once:1,f:k=>{const H=HOLIDAYS.find(x=>x.k===k);if(L.cash<H.c)return null;ap({cash:-H.c,hap:H.hap,str:H.str});L.stats.trips[k]=(L.stats.trips[k]||0)+1;return `You went on a ${H.n}. Bliss.`;}},
 gamble:{e:'🎰',f:v=>{const [g,b]=String(v).split(':');return gamble(g,+b);}},
 lottoA:{e:'🎟️',once:1,f:()=>{if(L.cash<20)return null;ap({cash:-20});const r=Math.random();if(r<.001){ap({cash:1e6,hap:30});confettiSoon();return 'JACKPOT! You won $1,000,000!';}if(r<.05){const n=ri(20,800);ap({cash:n});return `You won a minor prize of ${fmt(n)}.`;}return 'No luck.';}},
};
/* ---------- modals ---------- */
let CUR=null,EQ=[],CONF=null;
function showModal(h){$('#modal').innerHTML=h;$('#modalWrap').classList.add('on');mOpen=true;$('#modal').scrollTop=0;}
function hideModal(){$('#modalWrap').classList.remove('on');mOpen=false;}
function choiceModal(c){CUR=c;if(!c.opts.some(o=>o.ok!==false))c.opts[c.opts.length-1].ok=true;
 showModal(`<span class="tag">${c.tag||'Age '+L.age}</span><div class="mE">${c.e}</div><div class="mT">${esc(c.t)}</div><div class="mX">${esc(c.x)}</div><div class="mC">${c.opts.map((o,i)=>`<button class="btn ${i===0?'pri':''} ${o.ok===false?'dis':''}" data-act="choose" data-i="${i}">${esc(o.l)}</button>`).join('')}</div>`);haptic();}
function choose(i){const c=CUR,o=c.opts[i];if(!o||o.ok===false)return;const [res,fx]=withFx(()=>o.f());const text=res||o.l;
 addLog(c.e,`${c.t}: ${text}`,fx);checkRibbons();
 showModal(`<div class="mE">${c.e}</div><div class="mT">${esc(c.t)}</div><div class="mR">${esc(text)}${chipsHTML(fx)}</div><button class="btn pri block" data-act="mnext">Continue</button>`);
 const good=(fx.cash||0)>0||(fx.hap||0)>0;sfx(good?'win':'tap');haptic(good?'win':'');renderTop();renderLog();save();}
function mnext(){const c=CUR;CUR=null;hideModal();if(c&&c.onDone)c.onDone();}
function resultModal(e,t,text,fx){CUR={e,t};showModal(`<div class="mE">${e}</div><div class="mT">${esc(t)}</div><div class="mR">${esc(text)}${chipsHTML(fx)}</div><button class="btn pri block" data-act="mnext">OK</button>`);}
function confirmModal(text,fn,yes='Yes'){CONF=fn;showModal(`<div class="mE">🤔</div><div class="mX" style="margin-top:8px">${esc(text)}</div><div class="mC"><button class="btn pri" data-act="cyes">${esc(yes)}</button><button class="btn" data-act="cno">Cancel</button></div>`);}
function runQueue(q){EQ=q.slice();nextEvent();}
function nextEvent(){const it=EQ.shift();if(!it){render();save();return;}const {ev,ctx,text}=it;
 if(ev.c){let ok=false;try{ok=ev.c();}catch(e){}if(!ok)return nextEvent();}
 choiceModal({e:ev.e,t:ev.t,x:text,opts:ev.o.map(o=>({l:typeof o[0]==='function'?o[0](ctx):o[0],f:()=>o[1](ctx),ok:o[2]?!!o[2](ctx):true})),onDone:nextEvent});}
function runAct(v,id){const A=ACT[v];if(!A)return;const key=v+(id??'');
 if(A.once&&L.done[key]){toast('Already done that this year. Age up!');return;}
 const go=()=>{const [res,fx]=withFx(()=>A.f(id));if(res==null){toast('Not enough cash or not available.');haptic('bad');return;}if(A.once)L.done[key]=1;
  addLog(A.e,res,fx);checkRibbons();renderTop();renderLog();renderSheet(false);save();
  if(v==='gamble'){toast((fx.cash||0)>0?'🎉 '+res:'💸 '+res);sfx((fx.cash||0)>0?'win':'bad');return;}
  resultModal(A.e,'',res,fx);sfx((fx.cash||0)>0||(fx.hap||0)>0?'win':'tap');};
 const ct=A.confirm&&A.confirm(id);if(ct)confirmModal(ct,go);else go();}
function bizRaise(id){const b=bz(id);if(L.done['raise'+id]){toast('You already pitched investors this year.');return;}L.done['raise'+id]=1;const o=raiseOffer(b);
 if(!o){resultModal('💼','Investors passed','"Come back when you have more traction." Grow revenue first.',{});return;}
 choiceModal({e:'💼',t:'Term sheet',tag:b.name,x:`Investors offer ${fmt(o.amt)} for ${Math.round(o.eq*100)}% of ${b.name}. The cash becomes runway to cover losses and fund hiring.`,opts:[
  {l:'Take the deal',f:()=>{b.run+=o.amt;b.raised+=o.amt;b.eq*=1-o.eq;b.val+=o.amt;b.q=clamp(b.q+6,0,100);b.br=clamp(b.br+6,0,100);ap({rep:3});return `Raised ${fmt(o.amt)}! You now own ${Math.round(b.eq*100)}%.`;}},
  {l:'Walk away',f:()=>'You keep your equity.'}],onDone:()=>renderSheet(false)});}
function bizSell(id){const b=bz(id);if(b.val<=0)return toast('No buyer wants it yet.');const p=sellOffer(b);
 choiceModal({e:'🤝',t:'Acquisition offer',tag:b.name,x:`A buyer offers ${fmt(p)} for your ${Math.round(b.eq*100)}% stake in ${b.name}.`,opts:[
  {l:'Sell it!',f:()=>{ap({cash:p,hap:12,rep:5});L.stats.exits++;L.stats.bestExit=Math.max(L.stats.bestExit,p);closeBiz(b,'sold',p);if(p>=1e6)confettiSoon();return `Exit! You sold ${b.name} for ${fmt(p)}.`;}},
  {l:'Not yet',f:()=>'You keep building.'}],onDone:()=>{STACK=STACK.filter(s=>!(s.t==='biz'&&!bz(s.id)));renderSheet(false);}});}
function findLove(){if(L.done.findLove)return toast('Already swiped enough this year.');L.done.findLove=1;const p=newPartner();
 choiceModal({e:'💘',t:'New match',tag:'Dating app',x:`You matched with ${p.first} ${p.last}, ${p.age}. ${pick(['Loves hiking and dogs.','Works in finance. Bio says "no time wasters".','Tradie with a heart of gold.','Makes a mean sourdough.','Startup founder. Of course.','Just moved here from the UK.'])}`,opts:[
  {l:'Go on a date',f:()=>{if(chance(.45+L.st.cha/250)){L.people.push(p);ap({hap:8});return `It went great! You and ${p.first} are seeing each other.`;}ap({hap:-3});return `${p.first} ghosted you after the first date.`;}},
  {l:'Swipe left',f:()=>'Not your type.'}],onDone:()=>renderSheet(false)});}
function propose(id){const p=per(id);if(L.done['pPropose'+id])return toast('Give it a year.');L.done['pPropose'+id]=1;
 if(!chance(p.bond/110+.05)){p.bond-=20;ap({hap:-12});addLog('💍',`You proposed to ${p.first}. They said no.`,{hap:-12});resultModal('💔','Ouch',`${p.first} said they're not ready.`,{hap:-12});return;}
 choiceModal({e:'💍',t:'They said yes!',tag:p.first,x:`${p.first} said yes! What kind of wedding?`,opts:[
  {l:'Big wedding ($45k)',ok:money(45000),f:()=>marry(45000,'A huge wedding at a winery. Uncle Steve gave a speech.')},
  {l:'Small wedding ($9k)',ok:money(9000),f:()=>marry(9000,'Small, beautiful and in the backyard.')},
  {l:'Elope ($1.5k)',ok:money(1500),f:()=>marry(1500,'You eloped at the registry office and went to the pub.')}],onDone:()=>renderSheet(false)});}

/* ---------- overlays ---------- */
let NL={g:'r',w:'r',c:'r',s:0,first:'',last:''};
function showNewLife(){const o=$('#over');o.classList.add('on');closeSheet();hideModal();
 o.innerHTML=`<div class="logo">Hustle <span>Life</span></div><div class="hint" style="text-align:center;margin-bottom:14px">An Aussie life sim. Build an empire one year at a time.</div>
 <button class="btn pri block" style="min-height:58px;font-size:17px" data-act="nlRandom">🎲 Random life (from birth)</button>
 <button class="btn gold block" style="margin-top:10px" data-act="nlRandom16">🎒 Random life at 16</button>
 <div class="sec" style="margin-top:20px">Or customise</div>
 <div class="g2"><input type="text" id="nlFirst" placeholder="First name" maxlength="16" value="${esc(NL.first)}"><input type="text" id="nlLast" placeholder="Surname" maxlength="18" value="${esc(NL.last)}"></div>
 <div class="sec">Gender</div><div class="seg">${[['r','🎲 Random'],['m','👦 Boy'],['f','👧 Girl']].map(([v,n])=>`<button class="${NL.g===v?'on':''}" data-act="nlSet" data-k="g" data-v="${v}">${n}</button>`).join('')}</div>
 <div class="sec">Start</div><div class="seg">${[[0,'👶 At birth'],[16,'🎒 At 16']].map(([v,n])=>`<button class="${NL.s===v?'on':''}" data-act="nlSet" data-k="s" data-v="${v}">${n}</button>`).join('')}</div>
 <div class="sec">Family wealth</div><div class="seg" style="grid-auto-columns:auto">${[['r','🎲'],...WEALTH.map((w,i)=>[i,w.e])].map(([v,n])=>`<button class="${String(NL.w)===String(v)?'on':''}" data-act="nlSet" data-k="w" data-v="${v}">${n}</button>`).join('')}</div>
 <div class="hint" id="nlWealth">${NL.w==='r'?'Random family background':WEALTH[NL.w].n}</div>
 <div class="sec">City</div><div class="g3">${[['r','🎲 Random'],...CITIES.map((c,i)=>[i,c.n])].map(([v,n])=>`<button class="opt ${String(NL.c)===String(v)?'on':''}" data-act="nlSet" data-k="c" data-v="${v}">${n}</button>`).join('')}</div>
 <button class="btn pri block" style="margin-top:16px;min-height:54px" data-act="nlStart">Start this life →</button>
 ${G.meta.lives?`<div class="hint" style="text-align:center;margin-top:10px">${G.meta.lives} li${G.meta.lives===1?'fe':'ves'} lived · ${Object.keys(G.meta.ribbons).length} ribbons</div>`:''}`;}
function startLife(o){G.meta.gen=1;newLife(o);$('#over').classList.remove('on');STACK=[];lastAge=-1;render();save();
 setTimeout(()=>toast('Tap + AGE to live another year'),500);}
function showDeath(){$('#toasts').innerHTML='';sfx('death');haptic('bad');const o=$('#over');o.classList.add('on');closeSheet();const rb=L.lifeRibbon||lifeRibbon(),n=nw(),ks=kids(),st=L.stats;
 const mine=RIBBONS.filter(r=>{const g=G.meta.ribbons[r.id];return g&&g.name===fullName()&&g.year<=L.year&&g.year>=L.born;});
 o.innerHTML=`<div class="hint" style="text-align:center;letter-spacing:2px;text-transform:uppercase;font-weight:900">Rest in peace</div><div class="bigR">${rb[0]}</div>
 <div class="logo" style="font-size:26px">${esc(fullName())}</div><div class="hint" style="text-align:center">${L.born} – ${L.year} · died at ${L.age} from ${esc(L.cause)}</div>
 <div style="text-align:center;margin:10px 0"><span class="pill g" style="font-size:14px;padding:6px 14px">${rb[1]}</span></div>
 <div class="card"><div class="kv"><div><span>Net worth</span><b class="${n>=0?'pos':'neg'}">${fmt(n)}</b></div><div><span>Peak</span><b>${fmt(st.peakNw)}</b></div><div><span>Earned</span><b>${fmt(st.earned)}</b></div>
 <div><span>Businesses</span><b>${st.bizStarted}</b></div><div><span>Exits</span><b>${st.exits}</b></div><div><span>Kids</span><b>${st.kids}</b></div></div></div>
 ${mine.length?`<div class="sec">Ribbons earned this life</div><div class="g3">${mine.map(r=>`<div class="ribbon"><span class="re">${r.e}</span>${r.n}</div>`).join('')}</div>`:''}
 <div class="sec">What next?</div>
 ${ks.length?ks.map(k=>row(avatar(k),'Continue as '+esc(k.first),`${relLabel(k)} · age ${k.age} · inherits ${fmt(L.estate.each)}`,'›','data-act="heir" data-id="'+k.id+'"')).join(''):'<div class="hint">No children to carry on the family name.</div>'}
 <button class="btn pri block" style="margin-top:8px" data-act="newlife">🌱 Start a new life</button>`;}

/* ---------- save ---------- */
function save(){if(!G)return;try{G.savedAt=Date.now();localStorage.setItem(SAVE_KEY,JSON.stringify({v:SAVE_VERSION,savedAt:G.savedAt,game:G}));}catch(e){console.warn('save failed',e);}}
function migrate(d){if(!d||!d.game)throw new Error('Not a Hustle Life save');if((d.v||1)>SAVE_VERSION)throw new Error('Save is from a newer version');const g=d.game;
 const fm=freshMeta();g.meta=Object.assign(fm,g.meta||{});g.meta.settings=Object.assign(freshMeta().settings,g.meta.settings||{});
 if(g.life){const l=g.life;l.stats=Object.assign({bizStarted:0,exits:0,bestExit:0,peakNw:0,yearsWorked:0,fifoYears:0,gamble:0,donated:0,breakups:0,kids:0,trips:{},inherited:0,droppedOut:false,stressYears:0,cryptoLoss:0,earned:0},l.stats||{});
  for(const k of ['biz','bizHist','assets','people','ill','log','quals'])if(!Array.isArray(l[k]))l[k]=[];for(const k of ['done','once','cd'])if(!l[k])l[k]={};}
 g.v=SAVE_VERSION;return g;}
function load(){try{const raw=localStorage.getItem(SAVE_KEY);return raw?migrate(JSON.parse(raw)):null;}catch(e){console.warn('load failed',e);return null;}}
function exportCode(){save();return 'HL1:'+btoa(unescape(encodeURIComponent(localStorage.getItem(SAVE_KEY))));}
function importCode(c){c=(c||'').trim();if(!c.startsWith('HL1:'))throw new Error('Not a Hustle Life save code');return migrate(JSON.parse(decodeURIComponent(escape(atob(c.slice(4))))));}

/* ---------- input ---------- */
document.addEventListener('pointerdown',unlockAudio,{passive:true});
document.addEventListener('input',e=>{if(e.target.id==='bizName'&&startTmp)startTmp.name=e.target.value;if(e.target.id==='nlFirst')NL.first=e.target.value;if(e.target.id==='nlLast')NL.last=e.target.value;});
$('#sheetWrap').addEventListener('click',e=>{if(e.target.id==='sheetWrap')closeSheet();});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v,id=b.dataset.id;
 switch(a){
 case 'age':onAge();break;
 case 'sheet':if(L&&L.alive||v==='settings'||v==='ribbons')openSheet(v);break;
 case 'go':pushSheet(v,id);break;
 case 'back':popSheet();break;
 case 'close':closeSheet();break;
 case 'do':if(v==='raise')bizRaise(id);else if(v==='sell')bizSell(id);else if(v==='findLove')findLove();else if(v==='pPropose')propose(id);else runAct(v,id);break;
 case 'bizset':{const x=bz(id);x[b.dataset.k]=Number(v);renderSheet(false);haptic();break;}
 case 'bizStaff':{const x=bz(id);x.staff=Math.max(0,x.staff+Number(v));renderSheet(false);toast(`${x.name}: ${x.staff} staff (~${fmt(x.staff*80000)}/yr wages)`);break;}
 case 'bizDice':startTmp.name=genName(startTmp.k);$('#bizName').value=startTmp.name;break;
 case 'bizCof':startTmp.cof=+id||null;renderSheet(false);break;
 case 'bizGo':{const nm=(($('#bizName')||{}).value||startTmp.name).trim().slice(0,28)||genName(startTmp.k);const [bb,fx]=withFx(()=>startBiz(startTmp.k,{name:nm,cof:startTmp.cof}));if(!bb){toast('Not enough cash.');break;}
  const T=BIZ[bb.k];addLog(T.e,`You launched ${bb.name}, a ${T.n.toLowerCase()}${bb.cof?' with '+per(bb.cof).first:''}!`,fx);startTmp=null;STACK=[{t:'business'},{t:'biz',id:bb.id}];renderSheet(true);renderTop();renderLog();save();
  resultModal(T.e,bb.name,'Your business is live! Results arrive each time you age up. Set your marketing, time and team below.',fx);sfx('win');break;}
 case 'choose':choose(+b.dataset.i);break;
 case 'mnext':mnext();break;
 case 'cyes':{const f=CONF;CONF=null;hideModal();f&&f();break;}
 case 'cno':CONF=null;hideModal();break;
 case 'toggle':G.meta.settings[v]=!G.meta.settings[v];renderSheet(false);save();break;
 case 'export':$('#saveCode').value=exportCode();toast('📤 Save code ready. Keep it somewhere safe!');break;
 case 'copy':{const ta=$('#saveCode');if(!ta.value)ta.value=exportCode();ta.select();(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast('📋 Copied!')).catch(()=>{try{document.execCommand('copy');toast('📋 Copied!');}catch(_){toast('Select the text and copy it manually');}});break;}
 case 'import':try{G=importCode($('#saveCode').value);L=G.life;save();closeSheet();lastAge=-1;if(L&&L.alive){$('#over').classList.remove('on');render();}else if(L){render();showDeath();}else showNewLife();toast('📥 Save imported!');}catch(err){toast('❌ '+err.message);$('#saveCode').classList.add('shake');}break;
 case 'reset':confirmModal('Delete ALL lives, ribbons and progress on this device? Export a save code first if you might want it back.',()=>{localStorage.removeItem(SAVE_KEY);G={v:SAVE_VERSION,meta:freshMeta(),life:null};L=null;save();showNewLife();},'Delete everything');break;
 case 'abandon':confirmModal('Abandon this life and start a new one? Ribbons are kept.',()=>{showNewLife();});break;
 case 'nlSet':{NL[b.dataset.k]=b.dataset.k==='s'?+v:(v==='r'?'r':(b.dataset.k==='g'?v:+v));showNewLife();break;}
 case 'nlRandom':startLife({});break;
 case 'nlRandom16':startLife({start16:true});break;
 case 'nlStart':startLife({first:NL.first.trim()||undefined,last:NL.last.trim()||undefined,g:NL.g==='r'?undefined:NL.g,wealth:NL.w==='r'?undefined:NL.w,city:NL.c==='r'?undefined:NL.c,start16:NL.s===16});break;
 case 'heir':heirLife(+id);$('#over').classList.remove('on');STACK=[];lastAge=-1;render();save();toast(`You are now ${fullName()}. Generation ${G.meta.gen}.`);break;
 case 'newlife':showNewLife();break;
 }});
function onAge(){if(mOpen||!L||!L.alive)return;unlockAudio();haptic();sfx('age');closeSheet();const r=ageUp();lastAge=-1;render();save();
 const btn=$('#ageBtn .c');btn.classList.remove('flash');void btn.offsetWidth;
 if(r.dead){setTimeout(showDeath,700);return;}runQueue(r.queue);}

/* ---------- lifecycle ---------- */
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});
window.addEventListener('pagehide',save);
setInterval(save,3000);
function setupManifest(){try{const icon=document.querySelector('link[rel=apple-touch-icon]').href;const m={name:'Hustle Life',short_name:'Hustle Life',start_url:location.href.split('#')[0],display:'standalone',orientation:'portrait',background_color:'#0e1420',theme_color:'#0e1420',icons:[{src:icon,sizes:'192x192',type:'image/png',purpose:'any maskable'}]};$('#manifestLink').href='data:application/manifest+json;charset=utf-8,'+encodeURIComponent(JSON.stringify(m));}catch(e){}}
function init(){setupManifest();G=load();if(!G)G={v:SAVE_VERSION,meta:freshMeta(),life:null};L=G.life;
 if(!L){showNewLife();return;}render();if(!L.alive)showDeath();}
window.HL={get G(){return G;},get L(){return L;},ACT,startBiz,applyJob,JOBS,BIZ,genListings,buyProp,invest,withFx,checkRibbons,die,ageUp,save,load,nw,newLife,startLife,heirLife,runAct,EVENTS,render,showDeath};
init();
</script>
</body>
